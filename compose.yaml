services:
  api:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      MAX_BLOCK_SECONDS: ${MAX_BLOCK_SECONDS:-8}
      # Pass through only when set: the single default lives in src/config.ts.
      WINDOW_SECONDS: ${WINDOW_SECONDS:-}
      MAX_VIDEO_SECONDS: ${MAX_VIDEO_SECONDS:-}
      CACHE_DIR: /data/cache
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      # Per-tenant destinations: mount your tenants JSON and the service
      # account key into the container, then point these at the in-container
      # paths (e.g. - ./tenants.json:/data/tenants.json:ro and
      # TENANTS_FILE=/data/tenants.json). See README "Per-tenant destinations".
      TENANTS_FILE: ${TENANTS_FILE:-}
      TENANTS_JSON: ${TENANTS_JSON:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_CREDENTIALS_JSON: ${GOOGLE_CREDENTIALS_JSON:-}
      # webdav destinations read the NAS password from the env var named by
      # password_env in the tenants file (e.g. NAS_WEBDAV_PASSWORD); pass it
      # through here. The base_url must be https — reach a LAN NAS through a
      # mesh VPN such as Tailscale, never by exposing it to the internet.
      NAS_WEBDAV_PASSWORD: ${NAS_WEBDAV_PASSWORD:-}
      # Web sign-in: set all four together (see README "Web sign-in").
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Per-client job limits for the anonymous surface (no SERVICE_TOKEN);
      # see README "Per-client job limits". Pass through only when set —
      # the defaults live in src/config.ts.
      MAX_CONCURRENT_JOBS_PER_CLIENT: ${MAX_CONCURRENT_JOBS_PER_CLIENT:-}
      MAX_JOBS_PER_HOUR_PER_CLIENT: ${MAX_JOBS_PER_HOUR_PER_CLIENT:-}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
    volumes:
      - ${CACHE_DIR:-./transcript-cache}:/data/cache

  # Discord bot: post a YouTube URL in an enabled channel, get the transcript
  # back in the same channel or thread. Needs DISCORD_TOKEN and
  # BOT_ENCRYPTION_KEY; talks only to the api service.
  bot:
    build: .
    command: ["dist/bot.js"]
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      BOT_ENCRYPTION_KEY: ${BOT_ENCRYPTION_KEY:-}
      API_BASE_URL: http://api:8080
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      BOT_DATA_FILE: /data/bot-data.json
    volumes:
      - ${BOT_DATA_DIR:-./bot-data}:/data
    depends_on:
      - api
    restart: unless-stopped

  # MCP stdio server for agent runtimes (Claude Code, Codex, any MCP client):
  # point the client at `docker compose run --rm -T mcp` — remote mode, jobs
  # run on the api service with the caller's own Gemini key.
  mcp:
    build: .
    profiles: ['mcp']
    command: ["dist/mcp.js"]
    stdin_open: true
    environment:
      FISHERAIAGENT_URL: http://api:8080
      FISHERAIAGENT_TOKEN: ${SERVICE_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - api

  # One-off CLI runs: docker compose run --rm transcribe <youtube-url>
  transcribe:
    build: .
    profiles: ['cli']
    entrypoint: ["node", "dist/cli.js"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      MAX_BLOCK_SECONDS: ${MAX_BLOCK_SECONDS:-8}
      # Pass through only when set: the single default lives in src/config.ts.
      WINDOW_SECONDS: ${WINDOW_SECONDS:-}
      MAX_VIDEO_SECONDS: ${MAX_VIDEO_SECONDS:-}
      CACHE_DIR: /data/cache
    volumes:
      - ${CACHE_DIR:-./transcript-cache}:/data/cache

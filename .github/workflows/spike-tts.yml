name: spike-tts

on:
  pull_request:
    paths: ['spike/tts/**', '.github/workflows/spike-tts.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
      - name: Install Node libraries (spike/tts only)
        working-directory: spike/tts
        run: npm ci
      - name: Run spike (cloud)
        working-directory: spike/tts
        run: node run.mjs gha
      - name: Cloud results summary
        if: always()
        working-directory: spike/tts
        run: |
          ls -l results
          node -e "const d=JSON.parse(require('fs').readFileSync('results/gha.json','utf8'));for(const r of d.runs)console.log(r.engine,r.kind,r.run,r.status,r.wall_s,r.audio_s,r.requests,r.boundary_events,r.error)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-tts-results
          path: spike/tts/results/
